id: "pac"
name: "PAC"
category: "Analysis"
subcategory: "Time-Frequency"
version: "1.0"
icon: "icn_pac.png"
logic_class: "Pac_plugin"
ui_class: ""
description: "Calculates the relationship between the phase of a low-frequency band and the amplitude of a frequency range in an EEG signal using the Wavelet Transform. Allows users to select the phase band, amplitude frequency range, and trial mode (single trial or average across multiple trials). The output includes a phase-frequency coupling map, a histogram of amplitude distribution as a function of phase, and a mean coupling vector with its magnitude and angle."